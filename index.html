    <script>
      // Global error interceptor to catch and suppress benign browser extension / iframe port disconnect errors
      (function() {
        function isIgnorable(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || String(err));
          return (
            msg.indexOf('disconnected port object') !== -1 ||
            msg.indexOf('message channel closed') !== -1 ||
            msg.indexOf('Extension context invalidated') !== -1 ||
            msg.indexOf('ResizeObserver loop completed') !== -1 ||
            msg.indexOf('ResizeObserver loop limit exceeded') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (isIgnorable(event.message) || isIgnorable(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnorable(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
